<!DOCTYPE html>
<html>
<head lang="en">
    <title>Push To Talk Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="PTT Key">
        <sdpi-textfield setting="key" placeholder="v" default="v"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item>
        <small>
            Bind this same key in <b>Marathon &rarr; Settings &rarr; Audio &rarr; Push-to-Talk</b>.
            Examples: <code>v</code>, <code>capslock</code>, <code>f13</code>,
            <code>ctrl+shift+v</code>. Modifiers supported: <code>ctrl</code>, <code>shift</code>,
            <code>alt</code>, <code>win</code>. The key is held while the Stream Deck button is pressed.
        </small>
    </sdpi-item>
</body>
</html>
