<!DOCTYPE html>
<html>
<head lang="en">
    <title>Mute Others Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Toggle Key">
        <sdpi-textfield setting="key" placeholder="n" default="n"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item>
        <small>
            Bind this same key in <b>Marathon &rarr; Settings &rarr; Audio &rarr; Mute Team</b>
            (a.k.a. deafen). Examples: <code>n</code>, <code>f15</code>, <code>ctrl+shift+m</code>.
            The button tracks its own on/off state &mdash; tap it once to resync if it drifts.
        </small>
    </sdpi-item>
</body>
</html>
