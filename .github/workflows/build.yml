name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build plugin bundle
        run: npm run build

      - name: Validate Stream Deck manifest
        run: npx streamdeck validate ./com.jossy.marathon.sdPlugin --no-update-check
