name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build plugin bundle
        run: npm run build

      - name: Resolve plugin version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Stream Deck manifest version is 4-part dotted (e.g. 0.1.0.0).
          # Append .0 to a 3-part semver tag like 0.1.0.
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SD_VERSION="${TAG}.0"
          elif [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SD_VERSION="$TAG"
          else
            echo "Tag $GITHUB_REF_NAME does not match v<major>.<minor>.<patch>[.<build>]" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sd_version=$SD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack .streamDeckPlugin
        run: |
          mkdir -p dist
          npx streamdeck pack ./com.jossy.marathon.sdPlugin \
            --version "${{ steps.version.outputs.sd_version }}" \
            --output dist \
            --force \
            --no-update-check

      - name: Locate package
        id: pkg
        run: |
          FILE=$(find dist -maxdepth 1 -name "*.streamDeckPlugin" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No .streamDeckPlugin file produced" >&2
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.path }}" \
            --title "v${{ steps.version.outputs.tag }}" \
            --generate-notes
